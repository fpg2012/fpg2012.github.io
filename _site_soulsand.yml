site_name: "Empty Space"
author: "nth233"
url: "//soulsand.top"
favicon: "/assets/favicon"
theme_dir: "_theme_empty"
gen_dir: "_gen_soulsand"
syntect_css: true

# soulsand-specific build: use sushi's built-in markdown converter.
# No pandoc, pandocfilters, pygments, pandoc-katex, Node or Python.
#
# Known differences from the nth233/Pandoc build:
#   1. pulldown-cmark does not emit heading ids in the static HTML.
#      assets/js/generate-toc.js (site-level override) adds ids at
#      runtime, so TOC / #anchor links work in the browser.
#   2. syntect class names differ from Pygments; assets/style/syntect.css
#      is included via _includes/katexcss.liquid when syntect_css is true.
#   3. images are wrapped in <figure><figcaption></figcaption></figure>.
convert_ext: ["html", "md", "xml"]
converter_choice:
  "md": "__internal__"

utterances: true

counting_stars:
  url: "//like.soulsand.top"

social_media:
  bilibili: "//space.bilibili.com/11616223"
  github: "//github.com/fpg2012"
